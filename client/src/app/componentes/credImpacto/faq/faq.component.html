<!-- ==========================================================
BREADCRUMB
========================================================== -->

<section class="topo">
  <div class="container">
    <div class="row justify-content-center">
      <div class="col-12 text-center">
        <div class="breadcrumb-content">
          <div class="breadcrumb-custom">
            credimpacto >
            <strong>Suporte></strong>
            <strong>FAQ</strong>
          </div>
          <h1>
            Dúvidas Frequentes (FAQ)
          </h1>
        </div>
      </div>
    </div>
  </div>
</section>

<section class="faq-section">
  <div class="container">

    <div class="row justify-content-center">
      <div class="col-lg-10 col-xl-9">

        <div class="card faq-card shadow-sm border-0">

          <div class="card-body">

            <div class="faq-wrapper">

              <!-- Controles -->
              <div class="faq-controls">

                <input class="form-control" placeholder="Pesquisar dúvida..." [(ngModel)]="busca" (input)="filtrar()">

                <div class="actions">
                  <button class="btn btn-success btn-sm" (click)="abrirTodos()">
                    Abrir todas
                  </button>

                  <button class="btn btn-secondary btn-sm" (click)="fecharTodos()">
                    Fechar todas
                  </button>

                  <span class="contador">
                    Abertas: {{ abertas }}
                  </span>
                </div>

              </div>

              <!-- FAQ -->

              <div *ngFor="let cat of categorias">

                <h4 class="categoria">{{ cat }}</h4>

                <div *ngFor="let item of porCategoria(cat)" class="faq-item">

                  <div class="faq-question" (click)="toggle(item)">
                    <span>{{ item.pergunta }}</span>

                    <i class="bi" [ngClass]="item.open ? 'bi-chevron-up' : 'bi-chevron-down'">
                    </i>

                  </div>

                  <div class="faq-answer" *ngIf="item.open">
                    {{ item.resposta }}
                  </div>

                </div>

              </div>

              <!-- <div class="footer-info">
                Em caso de dúvidas adicionais, procure a Secretaria de Agricultura do seu município ou órgãos parceiros
                do programa.
              </div> -->

            </div>

          </div>

        </div>

      </div>
    </div>

  </div>
</section>
