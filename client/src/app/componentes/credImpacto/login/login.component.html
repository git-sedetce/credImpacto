<section class="login-page">

  <div class="container">

    <!-- Breadcrumb -->
    <div class="breadcrumb-login">
      credimpacto >
      <strong>Login</strong>
    </div>

    <!-- Cabeçalho -->
    <div class="text-center mb-5">

      <h1 class="titulo">
        Acesse sua conta
      </h1>

      <p class="subtitulo">
        Faça login para continuar utilizando a plataforma
        CredImpacto e acompanhar seus diagnósticos,
        inscrições e projetos.
      </p>

    </div>

    <!-- Card -->
    <div class="login-card">

      <!-- <div class="card-header-login">
        <span>Informe seus dados</span>
      </div> -->

      <form>

        <div class="mb-4">
          <label>Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-envelope"></i>
            </span>

            <input
              type="email"
              class="form-control"
              placeholder="Digite seu e-mail">

          </div>

        </div>

        <div class="mb-4">
          <label>Senha</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              placeholder="Digite sua senha">

          </div>

        </div>

        <div class="d-flex justify-content-between align-items-center mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox">
            <label class="form-check-label">
              Lembrar-me
            </label>
          </div>

          <a href="#">
            Esqueci minha senha
          </a>
        </div>
        <button
          class="btn btn-login w-100">
          Entrar
        </button>
      </form>

      <div class="text-center mt-4 criarConta">
        Ainda não possui cadastro?
        <a routerLink="credimpacto/cadastro">
          Criar conta
        </a>
      </div>
    </div>
  </div>

</section>
