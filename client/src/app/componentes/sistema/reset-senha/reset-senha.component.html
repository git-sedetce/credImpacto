<section class="login-page">

  <div class="container">

    <!-- Breadcrumb -->
    <div class="breadcrumb-login">
      sistema >
      <strong>Resetar Senha</strong>
    </div>

    <!-- Cabeçalho -->
    <div class="text-center mb-5">

      <h1 class="titulo">
        Nova Senha
      </h1>

      <p class="subtitulo">
        Crie uma nova senha para acessar sua conta na plataforma CredImpacto. A senha deve possuir no mínimo 8 caracteres, contendo letra maiúscula, letra minúscula, número e caractere especial.
      </p>

    </div>

    <!-- Card -->
    <div class="login-card">

      <!-- <div class="card-header-login">
        <span>Informe seus dados</span>
      </div> -->

      <form>

        <div class="mb-4">
          <label>Email</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-envelope"></i>
            </span>

            <input
              type="email"
              class="form-control"
              placeholder="Digite seu e-mail">

          </div>

        </div>

        <div class="mb-4">
          <label>Senha</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              placeholder="Digite sua senha">

          </div>
        </div>

        <div class="mb-4">
          <label>Confirmar Senha</label>
          <div class="input-group">
            <span class="input-group-text">
              <i class="fa-solid fa-lock"></i>
            </span>

            <input
              type="password"
              class="form-control"
              placeholder="Digite sua senha">

          </div>
        </div>

        <button
          class="btn btn-login w-100">
          Nova Senha
        </button>
      </form>

      <div class="text-center mt-4 criarConta">
        Ainda não possui cadastro?
        <a routerLink="/credimpacto/cadastro">
          Criar conta
        </a>
      </div>
    </div>
  </div>

</section>
