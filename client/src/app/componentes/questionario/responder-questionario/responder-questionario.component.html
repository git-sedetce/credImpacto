<div class="container">

  <div class="card shadow">

    <div class="card-header">
      <h2>{{questionario.nome}}</h2>
    </div>

    <div class="card-body">

      <div
        *ngFor="let pergunta of questionario.perguntas"
        class="mb-4">

        <h5>
          {{pergunta.ordem}} -
          {{pergunta.descricao}}
        </h5>

        <div
          *ngFor="let alternativa of pergunta.alternativas">

          <div class="form-check">

            <input
              class="form-check-input"
              type="radio"
              [name]="'pergunta'+pergunta.id"
              (change)="responder(
                pergunta.id,
                alternativa.id,
                alternativa.peso
              )">

            <label class="form-check-label">

              {{alternativa.descricao}}

            </label>

          </div>

        </div>

      </div>

      <button
        class="btn btn-success"
        (click)="finalizar()">

        Finalizar Questionário

      </button>

    </div>

  </div>

</div>
