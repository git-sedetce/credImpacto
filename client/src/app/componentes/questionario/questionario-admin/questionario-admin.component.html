<div class="container-fluid">

  <div class="card shadow">

    <div class="card-header">
      <h3>Novo Questionário</h3>
    </div>

    <div class="card-body">

      <div class="mb-3">
        <label>Nome</label>

        <input
          class="form-control"
          formControlName="nome">
      </div>

      <div class="mb-3">
        <label>Descrição</label>

        <textarea
          class="form-control"
          formControlName="descricao">
        </textarea>
      </div>

      <div
        formArrayName="perguntas"
        *ngFor="let pergunta of perguntas.controls; let i=index">

        <div
          class="card mt-4 pergunta-card"
          [formGroupName]="i">

          <div class="card-header">

            <div class="d-flex justify-content-between">

              <strong>
                Pergunta {{i + 1}}
              </strong>

              <button
                class="btn btn-success btn-sm"
                type="button"
                (click)="adicionarAlternativa(i)">

                + Alternativa

              </button>

            </div>

          </div>

          <div class="card-body">

            <input
              class="form-control mb-3"
              formControlName="descricao"
              placeholder="Digite a pergunta">

            <div formArrayName="alternativas">

              <div *ngFor="let item of getAlternativas(i).controls; let j=index" [formGroupName]="j">

                <div class="row mb-2">

                  <div class="col-md-8">

                    <input
                      class="form-control"
                      formControlName="descricao"
                      placeholder="Resposta">

                  </div>

                  <div class="col-md-4">

                    <input
                      type="number"
                      class="form-control"
                      formControlName="peso"
                      placeholder="Peso">

                  </div>

                </div>

              </div>

            </div>

          </div>

        </div>

      </div>

      <div class="mt-3">

        <button
          class="btn btn-primary me-2"
          (click)="adicionarPergunta()">

          Nova Pergunta

        </button>

        <button
          class="btn btn-success"
          (click)="salvar()">

          Salvar

        </button>

      </div>

    </div>

  </div>

</div>
