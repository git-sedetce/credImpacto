<nav class="header-admin px-3">

  <!-- Saudação -->
  <div class="header-title">
    <span *ngIf="!authenticated">
      Bem-vindo
    </span>

    <span *ngIf="authenticated">
      Olá, <strong>{{ user_name }}</strong>
    </span>
  </div>

  <!-- Ações -->
  <div class="header-actions">

    <!-- Usuário não autenticado -->
    <ng-container *ngIf="!authenticated">
      <button routerLink="/newuser" class="btn-header btn-register">

        <i class="fa fa-user-plus"></i>
        <span>Cadastre-se</span>

      </button>
    </ng-container>

    <!-- Usuário autenticado -->
    <ng-container *ngIf="authenticated">
      <button routerLink="/login" class="btn-header btn-logout" (click)="logout()">

        <i class="fa fa-sign-out-alt"></i>
        <span>Sair</span>

      </button>
    </ng-container>

  </div>

</nav>
